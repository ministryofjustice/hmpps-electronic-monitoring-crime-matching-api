---
# Per environment values which override defaults in hmpps-electronic-monitoring-crime-matching-api/values.yaml

generic-service:
  replicaCount: 2

  serviceAccountName: "hmpps-em-crime-matching-dev"

  ingress:
    host: electronic-monitoring-crime-matching-api-dev.hmpps.service.justice.gov.uk

  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.dev.json"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    ATHENA_OUTPUT_BUCKET: "s3://emds-test-athena-query-results-20240923095933297100000013"
    ATHENA_WORKGROUP: "crime-matching-mock-datastore-workgroup"
    MFA_REQUIRED: "false"
    DATASTORE_DATABASE: "acquisitive_crime_test_dbt"
    SPRINGDOC_API-DOCS_ENABLED: "true"
    SPRINGDOC_SWAGGER-UI_ENABLED: "true"
    FLIPT_URL: "https://feature-toggles-dev.hmpps.service.justice.gov.uk"

  namespace_secrets:
    athena-roles: null
    mock-datastore-roles:
      ATHENA_GENERAL_IAM_ROLE: "general_role_arn"

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  alertSeverity: hmpps-em-crime-matching-alerts-dev
  sqsAlertsTotalMessagesThreshold: 0
  sqsNumberAlertQueueNames:
    - hmpps-em-probation-devs-dev-email-notifications-dlq
  rdsAlertsDatabases:
    cloud-platform-aa6d54b06ce132e9: "Electronic Monitoring Crime Matching API Database"
  rdsAlertsConnectionThreshold: 65

deploy_stubs: false
deploy_grafana_dashboards: true
