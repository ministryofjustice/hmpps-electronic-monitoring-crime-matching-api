info.app:
  name: HMPPS Electronic Monitoring Crime Matching Api
  version: 1.0

spring:
  application:
    name: hmpps-electronic-monitoring-crime-matching-api
  codec:
    max-in-memory-size: 10MB

  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${services.hmpps-auth.url}/.well-known/jwks.json

      client:
        provider:
          hmpps-auth:
            token-uri: ${services.hmpps-auth.url}/oauth/token
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: 'jdbc:postgresql://${DB_SERVER}/${DB_NAME}?sslmode=prefer'
    username: ${DB_USER}
    password: ${DB_PASS}
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    version: 5.32.11 # workaround for v11 of hmpps-gradle-spring-boot https://github.com/ministryofjustice/hmpps-gradle-spring-boot/blob/main/release-notes/11.x.md#1102
    enabled: false

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful
  error:
    include-message: always

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'info, health, prometheus'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

services:
  hmpps-auth:
    url: ${HMPPS_AUTH_URL}
    mfa: ${MFA_REQUIRED}

notify:
  enabled: ${NOTIFY_API_ENABLED}
  base-url: https://api.notifications.service.gov.uk
  apikey: ${NOTIFY_API_KEY}
  successfulIngestionTemplateId: 4e75981e-ba14-477e-afea-5ec111c7bf11
  failedIngestionTemplateId: 57f34eb4-7fc6-4b2b-806b-f64d7b27a497
  partialIngestionTemplateId: 02a53929-0984-4d55-bb02-94e6f10d31a8
  errorIngestionTemplateId: 0357bd00-d129-423f-8a6f-0e1761cc13f8

flipt:
  url: ${FLIPT_URL}
  namespace: ${FLIPT_NAMESPACE}
  polling-interval-in-seconds: 120

aws:
  region: eu-west-2
  athena:
    role: ${ATHENA_GENERAL_IAM_ROLE}
  s3:
    bucket-name: police-emails

datastore:
  database: ${DATASTORE_DATABASE}
  output-bucket-arn: ${ATHENA_OUTPUT_BUCKET}
  workgroup: ${ATHENA_WORKGROUP}

email-ingestion:
  mailbox-address: ${MAILBOX_ADDRESS}
