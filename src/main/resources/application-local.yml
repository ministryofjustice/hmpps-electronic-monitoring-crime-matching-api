hmpps.sqs:
  provider: localstack
  region: eu-west-2
  useWebToken: false
  queues:
    audit:
      queueName: "audit"
    email:
      queueName: "email"
      subscribeTopicId: emailtopic
      dlqName: email_dlq
  topics:
    emailtopic:
      arn: arn:aws:sns:eu-west-2:000000000000:email-topic
    matchingnotificationstopic:
      arn: arn:aws:sns:eu-west-2:000000000000:matching-notifications

services:
  hmpps-auth:
    url: ${HMPPS_AUTH_URL:http://localhost:9090/auth}
    mfa: false

aws:
  region: eu-west-2
  s3:
    endpoint-url: http://localhost:4566

notify:
  enabled: true # If set to true, requires `docker compose up -d wiremock`
  base-url: http://localhost:8093/notify
  apikey: test-key-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx-yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy
  # WireMock routes responses based on template_id. The production template IDs (application.yml)
  # all receive a default 201 response. Override individual template IDs here to simulate error scenarios:
  #   00000000-0000-0000-0000-000000000400  →  400 Bad Request
  #   00000000-0000-0000-0000-000000000500  →  500 Internal Server Error (always)
  #   00000000-0000-0000-0000-000000005051  →  500 on first call, then 201 on retry
  # Example – to simulate a 500 on the successful-ingestion notification:
  #   successfulIngestionTemplateId: 00000000-0000-0000-0000-000000000500

flipt:
  url: https://feature-toggles-dev.hmpps.service.justice.gov.uk
  namespace: hmpps-electronic-monitoring-crime-matching
  polling-interval-in-seconds: 120

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?sslmode=prefer
    username: postgres
    password: postgres

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

email-ingestion:
  mailbox-address: "shared-mailbox@email.com"
